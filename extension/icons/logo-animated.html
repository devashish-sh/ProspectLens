<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProspectLens Animated Logo Test Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0F172A;
      color: #ffffff;
      font-family: 'Manrope', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border, #374151);
      border-radius: 16px;
      padding: 60px 80px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .preview-box {
      background: #1E293B;
      border: 1px solid #374151;
      padding: 30px 40px;
      border-radius: 12px;
      cursor: pointer;
    }
    .label {
      font-size: 13px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .info {
      font-size: 12px;
      color: #4b5563;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="label">Hover anywhere inside the box below</div>
    
    <div class="preview-box">
      <!-- Inline SVG Object -->
      <!-- Putting inline SVG so hover is triggered directly on page hover -->
      <div id="svg-container"></div>
    </div>
    
    <div class="info">Single, self-contained SVG asset with embedded animations.</div>
  </div>

  <script>
    // Fetch and inject the SVG inline to ensure CSS variables/animations resolve correctly in the document context
    fetch('logo-animated.svg')
      .then(response => response.text())
      .then(data => {
        document.getElementById('svg-container').innerHTML = data;
      });
  </script>
</body>
</html>
