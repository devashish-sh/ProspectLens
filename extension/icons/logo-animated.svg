<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 38" width="210" height="38" fill="none">
  <defs>
    <style>
      svg {
        background: transparent;
        overflow: visible;
      }
      .logo-icon {
        transform-origin: 16px 16px;
        transition: transform 1.0s cubic-bezier(0.25, 1, 0.5, 1), filter 1.0s cubic-bezier(0.25, 1, 0.5, 1);
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.22)) drop-shadow(0 0 4px rgba(255, 255, 255, 0.05));
      }
      svg:hover .logo-icon,
      .logo:hover .logo-icon,
      .sidebar-brand:hover .logo-icon {
        transform: scale(1.03);
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 18px rgba(74, 222, 128, 0.25));
      }
      .logo-handle {
        transform-origin: 19.8px 19.8px;
        transition: transform 1.0s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.0s ease;
      }
      svg:hover .logo-handle,
      .logo:hover .logo-handle,
      .sidebar-brand:hover .logo-handle {
        transform: translate(-3px, -3px) scale(0);
        opacity: 0;
      }
      .lens-sweeper {
        transform-origin: 14.5px 12.5px;
        transition: transform 0.6s ease;
      }
      svg:hover .lens-sweeper,
      .logo:hover .lens-sweeper,
      .sidebar-brand:hover .lens-sweeper {
        animation: rotate-anticlockwise 6.0s infinite linear;
      }
      .radar-line {
        animation: pulse 3.0s infinite ease-in-out;
      }
      .logo-text-prospect {
        transition: fill 0.6s ease, filter 0.6s ease;
      }
      svg:hover .logo-text-prospect,
      .logo:hover .logo-text-prospect,
      .sidebar-brand:hover .logo-text-prospect {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
      }
      .logo-text-lens {
        transition: fill 0.6s ease, filter 0.6s ease;
      }
      svg:hover .logo-text-lens,
      .logo:hover .logo-text-lens,
      .sidebar-brand:hover .logo-text-lens {
        fill: #5eff99;
        filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.45)) drop-shadow(0 0 16px rgba(74, 222, 128, 0.2));
      }
      
      .radar-ping {
        transform-origin: 14.5px 12.5px;
        pointer-events: none;
        opacity: 0;
      }
      svg:hover .radar-ping,
      .logo:hover .radar-ping,
      .sidebar-brand:hover .radar-ping {
        animation: ping-expand 2.2s infinite cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      .target-blip-1 {
        transform-origin: 10px 8.5px;
        opacity: 0.15;
      }
      svg:hover .target-blip-1,
      .logo:hover .target-blip-1,
      .sidebar-brand:hover .target-blip-1 {
        animation: blip-pulse-1 1.6s infinite ease-in-out;
      }
      .target-blip-2 {
        transform-origin: 18px 16.5px;
        opacity: 0.15;
      }
      svg:hover .target-blip-2,
      .logo:hover .target-blip-2,
      .sidebar-brand:hover .target-blip-2 {
        animation: blip-pulse-2 2.2s infinite ease-in-out;
      }
      
      @keyframes rotate-anticlockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }
      @keyframes ping-expand {
        0% { transform: scale(0.6); opacity: 0; }
        15% { opacity: 0.75; }
        85% { opacity: 0.15; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes blip-pulse-1 {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.5); }
      }
      @keyframes blip-pulse-2 {
        0%, 100% { opacity: 0.9; transform: scale(1.3); }
        50% { opacity: 0.1; transform: scale(0.7); }
      }
    </style>
  </defs>

  <!-- 1. Logo Icon Group -->
  <g class="logo-icon">
    <!-- Sonar Scan Wave Ripple (Radar Ping) -->
    <circle class="radar-ping" cx="14.5" cy="12.5" r="7.5" stroke="#4ade80" stroke-width="1.2"/>

    <!-- Inner Lens Sweeper Group -->
    <g class="lens-sweeper">
      <circle cx="14.5" cy="12.5" r="7.5" stroke="#4ade80" stroke-width="1.8" class="radar-line"/>
      <circle cx="14.5" cy="12.5" r="5" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.75" class="radar-line"/>
      <circle cx="14.5" cy="12.5" r="2.5" stroke="#4ade80" stroke-width="0.8" opacity="0.5" class="radar-line"/>
      <circle cx="14.5" cy="12.5" r="1.2" fill="#4ade80"/>
      <!-- Sweep hand pointing to 2 o'clock -->
      <line x1="14.5" y1="12.5" x2="20" y2="9" stroke="#4ade80" stroke-width="1.3"/>
      <circle cx="18.7" cy="9.8" r="0.9" fill="#4ade80"/>
    </g>
    
    <!-- Muted Radar Target Lock Blips -->
    <circle class="target-blip-1" cx="10" cy="8.5" r="0.8" fill="#4ade80"/>
    <circle class="target-blip-2" cx="18" cy="16.5" r="0.8" fill="#4ade80"/>
    
    <!-- White letter 'P' shape outer contour -->
    <path d="M7 12.5v15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14.5 5H16a7.5 7.5 0 0 1 7.5 7.5v0a7.5 7.5 0 0 1-7.5 7.5H7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Magnifying glass green handle -->
    <line class="logo-handle" x1="19.8" y1="19.8" x2="26" y2="26" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 2. Logo Brand Typography -->
  <g>
    <text x="38" y="21.5" font-family="Quicksand, system-ui, -apple-system, sans-serif" font-weight="700" font-size="15.5" fill="#ffffff" letter-spacing="-0.3">
      <tspan class="logo-text-prospect" fill="#ffffff">Prospect</tspan><tspan class="logo-text-lens" fill="#4ade80">Lens</tspan>
    </text>
    <text x="38" y="30.5" font-family="Quicksand, system-ui, -apple-system, sans-serif" font-weight="800" font-size="5.2" fill="#9ca3af" letter-spacing="1">
      LEAD INTELLIGENCE PLATFORM
    </text>
  </g>
</svg>
